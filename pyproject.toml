[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hullft"
version = "0.1.0"
description = "HullFT: Frank-Wolfe integerization + gradient-refresh test-time finetuning."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "transformers>=4.40",
    "datasets>=2.18",
    "faiss-cpu>=1.7.4",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "requests>=2.31",
    "zstandard>=0.22",
    "activeft>=0.1.0",
]

[project.optional-dependencies]
gpu = ["faiss-gpu>=1.7.4"]

[tool.setuptools.packages.find]
include = ["hullft*", "data*"]
